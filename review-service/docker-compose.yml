# docker-compose.yml
# Menjalankan review-service beserta database MongoDB miliknya, ditambah product-service
# (folder ../product-service) karena review-service memeriksa produk ke sana.
# Nanti compose dari semua service akan digabung jadi satu.

services:
  review-service:
    build: .
    ports:
      - "3002:3002"
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - FLASK_DEBUG=1
      - MONGO_URI=mongodb://appuser:apppassword@review-db:27017/?authSource=admin
      - MONGO_DB_NAME=reviewdb
      - PRODUCT_SERVICE_URL=http://product-service:3000
    depends_on:
      review-db:
        condition: service_healthy
      product-service:
        condition: service_started

  review-db:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=appuser
      - MONGO_INITDB_ROOT_PASSWORD=apppassword
    ports:
      - "27017:27017"
    volumes:
      - review-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  # product-service dari panduan sebelumnya. Folder product-service harus sejajar
  # dengan folder review-service, karena build dan init.sql dirujuk lewat ../product-service.
  # Di dalam jaringan Docker, review-service memanggilnya lewat nama service: product-service:3000.
  product-service:
    build: ../product-service
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=product-db
      - DB_USER=appuser
      - DB_PASSWORD=apppassword
      - DB_NAME=productdb
    depends_on:
      product-db:
        condition: service_healthy

  product-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=productdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
    ports:
      - "3306:3306"
    volumes:
      - product-db-data:/var/lib/mysql
      - ../product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=localhost", "--user=root", "--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

